# Publishes the browser-only app on GitHub Pages, at https://<owner>.github.io/<repository>/, on
# every push to main. Turn it on in the repository's Settings → Pages → Source: GitHub Actions.
# Only the app's files are published; notes stay on each device and in your Dropbox.
name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the site's address
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          # A <owner>.github.io repository is served from the root, any other from /<repository>/.
          case "$repo" in *.github.io) base=/ ;; *) base="/$repo/" ;; esac
          BASE_PATH="$base" npm run build:browser
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
